<section class="portal-main" data-portal-client-view>
  <div class="portal-wrap portal-wrap--wide">
    {{> team-nav }}

    <header class="portal-head">
      <div class="portal-head-text">
        <h1>Clients</h1>
        <p class="portal-meta">Every client portal you can work on. Open one to publish reports, add files and manage logins, or to see it as the client does.</p>
      </div>
    </header>

    <p class="form-status portal-status" data-portal-status role="status" aria-live="polite"></p>

    <div class="client-tools">
      <div class="field client-search">
        <label for="client-search">Search clients</label>
        <input type="search" id="client-search" data-client-search autocomplete="off" placeholder="Company name">
      </div>
      <div class="chip-row" role="group" aria-label="Show">
        <button type="button" class="chip" data-client-chip="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-client-chip="open" aria-pressed="false">With open approvals</button>
        <button type="button" class="chip" data-client-chip="nologin" aria-pressed="false">No logins</button>
      </div>
    </div>

    <div class="portal-card table-card">
      <p class="portal-empty" data-clients-loading>Loading&hellip;</p>
      <p class="portal-empty" data-clients-empty hidden></p>
      <table class="client-table" data-clients-table hidden>
        <thead>
          <tr>
            <th scope="col">Client</th>
            <th scope="col">Approvals</th>
            <th scope="col">Last activity</th>
            <th scope="col">Logins</th>
            <th scope="col" data-worked-col hidden>Worked on by</th>
            <th scope="col"><span class="visually-hidden">Open</span></th>
          </tr>
        </thead>
        <tbody data-client-rows></tbody>
      </table>
    </div>
  </div>
</section>
