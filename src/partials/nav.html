  <nav class="site-nav" aria-label="Primary">
    <a class="logo" href="/home" aria-label="Accessrank home">
      <span class="logo-mark" aria-hidden="true">
        <span class="layer layer-red"></span>
        <span class="layer layer-green"></span>
        <span class="layer layer-yellow"></span>
        <span class="icon icon-yellow"><svg viewBox="0 0 14 14"><path d="M3 7 L6 10 L11 4" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="icon icon-red"><svg viewBox="0 0 14 14"><line x1="7" y1="2.6" x2="7" y2="7.8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="11.6" r="1.1" fill="#FFFFFF"/></svg></span>
        <span class="icon icon-green"><svg viewBox="0 0 14 14"><path d="M3 7 L6 10 L11 4" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="swipe swipe-1"></span>
        <span class="swipe swipe-2"></span>
        <span class="swipe swipe-3"></span>
      </span>
      <span class="logo-word">Accessrank</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <div class="nav-right" id="nav-menu">
      {{#each nav}}
      <a class="nav-link{{#if this.cta}} cta-nav{{/if}}" href="{{ this.href }}"{{#if this.deck}} data-open-deck{{/if}}>{{ this.label }}</a>
      {{/each}}
      <!-- Theme switch. The label names what pressing it will do, and site.js
           keeps it in step with the current theme. -->
      <button class="theme-toggle" type="button" data-theme-toggle>
        <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.2 8.2 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="theme-toggle-label" data-theme-label>Switch to light mode</span>
      </button>
    </div>
  </nav>
